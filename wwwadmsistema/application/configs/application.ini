; ============================================================
; CONFIGURACIÓN DE LA APLICACIÓN ZEND FRAMEWORK (application.ini)
; ============================================================

[production]
phpSettings.display_startup_errors = 0
phpSettings.display_errors = 0
phpSettings.date.timezone = "America/Santiago"
phpSettings.error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT & ~E_NOTICE

; --- Configuración de Bootstrap ---
bootstrap.path = APPLICATION_PATH "/Bootstrap.php"
bootstrap.class = "Bootstrap"

; --- Arquitectura Modular ---
resources.frontController.moduleDirectory = APPLICATION_PATH "/modules"
resources.frontController.defaultModule = "correo-institucional"
resources.frontController.defaultControllerName = "index"
resources.frontController.defaultAction = "index"
resources.frontController.params.prefixDefaultModule = 1

; --- Layouts ---
resources.layout.layoutPath = APPLICATION_PATH "/layouts/scripts"

; --- Base de Datos MySQL (opcional si MySQL está levantado) ---
database.adapter = "PDO_MYSQL"
database.params.host = "localhost"
database.params.username = "root"
database.params.password = ""
database.params.dbname = "db_correo_aprendizaje"
database.params.charset = "utf8"

; --- Codificación de Vistas ---
resources.view.encoding = "UTF-8"

[staging : production]

[testing : production]
phpSettings.display_startup_errors = 1
phpSettings.display_errors = 1

[development : production]
phpSettings.display_startup_errors = 1
phpSettings.display_errors = 1
resources.frontController.params.displayExceptions = 1
